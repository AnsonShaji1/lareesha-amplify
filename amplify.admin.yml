# Optional console override for the admin Amplify app.
# Root amplify.yml + scripts/amplify-hosting-build.mjs already skips
# pipeline-deploy when AWS_APP_ID is not the storefront app, so this
# file is only needed if you pin admin to an explicit frontend-only spec.
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install --cache .npm --prefer-offline
    build:
      commands:
        - npx ampx generate outputs --branch $AWS_BRANCH --app-id d2ditwsuelgj89
        - npm run sync-outputs
        - npm run build:admin
  artifacts:
    baseDirectory: apps/admin/dist/admin/browser
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*
