<div class="auth-page">
  <div class="auth-page__inner">
    <div class="auth-page__layout">
      <div class="app-auth-panel">
        <div class="auth-form">
          @if (!emailSent) {
            <header class="auth-intro">
              <a routerLink="/" class="auth-logo" aria-label="Lareesha Luxe home">
                <img src="/lareesha_logo.png" alt="Lareesha Luxe" />
              </a>
              <h1>Forgot password</h1>
              <p>Enter your email and we’ll send a reset code.</p>
            </header>

            <form (ngSubmit)="onSubmit()">
              <label class="field">
                <span>Email</span>
                <input
                  type="email"
                  [(ngModel)]="email"
                  name="email"
                  autocomplete="email"
                  required
                  autofocus
                  [disabled]="isLoading"
                />
              </label>

              <button type="submit" class="ll-cta auth-submit" [disabled]="isLoading">
                {{ isLoading ? 'Sending…' : 'Send reset code' }}
              </button>
            </form>

            <p class="auth-hint">
              Signed up with Google? Password reset isn’t available —
              <a routerLink="/sign-in" queryParamsHandling="preserve">use Continue with Google</a>.
            </p>

            <p class="auth-switch">
              <a routerLink="/sign-in" queryParamsHandling="preserve">Back to sign in</a>
            </p>
          } @else {
            <header class="auth-intro">
              <a routerLink="/" class="auth-logo" aria-label="Lareesha Luxe home">
                <img src="/lareesha_logo.png" alt="Lareesha Luxe" />
              </a>
              <h1>Check your email</h1>
              <p>We sent a reset code to <strong>{{ email }}</strong>.</p>
            </header>

            <button type="button" class="ll-cta auth-submit" (click)="backToSignIn()">Back to sign in</button>

            <p class="resend-text">
              Didn’t receive the email?
              <a href="#" (click)="resendEmail($event)" [class.disabled]="isLoading">Resend</a>
            </p>
          }
        </div>
      </div>
    </div>
  </div>
</div>
