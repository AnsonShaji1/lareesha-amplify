<div class="account-page" [class.account-page--orders]="isOrdersPage">
  @if (!isOrdersPage) {
    <header class="page-header">
      <h1>Account</h1>
      @if (user) {
        <p class="page-description">{{ user.first_name }} {{ user.last_name }} · {{ user.email }}</p>
      }
    </header>

    <nav class="account-nav" aria-label="Account sections">
      <a routerLink="/account" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        Profile
      </a>
      <a routerLink="/account/orders" routerLinkActive="active">Orders</a>
      <a routerLink="/account/address" routerLinkActive="active">Addresses</a>
    </nav>
  }

  <main class="account-content">
    <router-outlet></router-outlet>
  </main>
</div>
